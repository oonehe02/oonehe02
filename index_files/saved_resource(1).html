<title>영신공업 무재해 현황판</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d4b93;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
}
#screen{
  width:100vw;
  height:100vh; /* iPhone 7/8 구형 Safari fallback */
  min-height:100vh;
  background:#0d4b93;
  padding:1.25vh 1.15vw 1vh;
  display:grid;
  grid-template-rows:28% 43% 15% 10%;
  gap:1.35vh;
}
.panel{
  overflow:hidden;
  border-radius:1.65vh;
}
.top{
  display:grid;
  grid-template-columns:50% 50%;
  background:#f7f7fa;
}
.brand{
  display:flex;align-items:center;justify-content:center;
  padding:0 3vw;
}
.brand img{
  width:84%;
  max-height:76%;
  object-fit:contain;
}
.today{
  border-left:2px solid #d7d8dc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#111;
}
.today .label{
  font-size:clamp(28px,2.3vw,52px);
  line-height:1;
  font-weight:800;
  margin-bottom:3.4vh;
}
.today .date{
  font-size:clamp(36px,3.0vw,68px);
  line-height:1;
  font-weight:900;
  letter-spacing:-0.06em;
  white-space:nowrap;
}
.mid{
  display:grid;
  grid-template-columns:36.8% 63.2%;
  gap:1.05vw;
}
.card{
  background:#092a67;
  border-radius:1.55vh;
  color:#fff;
}
.start{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.start .title{
  font-size:clamp(30px,2.3vw,52px);
  font-weight:800;
  margin-bottom:5.3vh;
}
.start .date{
  font-size:clamp(36px,2.95vw,67px);
  line-height:1;
  font-weight:900;
  letter-spacing:-0.06em;
  white-space:nowrap;
}
.days{
  display:flex;align-items:center;justify-content:center;
}
.daysbox{
  width:72%;
  transform:translateY(-0.4vh);
}
.days .title{
  font-size:clamp(30px,2.3vw,52px);
  font-weight:800;
  margin-bottom:1.2vh;
  white-space:nowrap;
}
.countrow{
  display:flex;align-items:flex-end;
}
.count{
  color:#63ff00;
  font-size:clamp(92px,8.2vw,180px);
  line-height:.78;
  font-weight:900;
  letter-spacing:-0.055em;
}
.unit{
  font-size:clamp(30px,2.75vw,62px);
  font-weight:800;
  margin-left:.65vw;
  padding-bottom:.9vh;
}
.slogan{
  background:linear-gradient(#1bc03c,#08a42e);
  border-radius:1.35vh;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,2.35vw,54px);
  font-weight:900;
  letter-spacing:-0.045em;
}
.check{font-size:1.17em;margin-right:1.35vw}
.footer{
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(17px,1.13vw,28px);
  font-weight:700;
  white-space:nowrap;
  text-align:center;
}
#frame{
  position:absolute;inset:0;
  pointer-events:none;
  border:0.52vh solid #1874db;
  border-radius:2vh;
  box-shadow:inset 0 0 0 .22vh rgba(255,255,255,.15);
}
#wrap{
  position:relative;width:100%;height:100%;
}
@supports (height: 100dvh) {
  #screen{height:100dvh;min-height:100dvh}
}
@supports (-webkit-touch-callout: none) {
  html,body,#wrap{height:-webkit-fill-available}
  #screen{min-height:-webkit-fill-available}
}

<script>
const START = new Date(2000, 8, 20);
function refresh(){
  const n = new Date();
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  document.getElementById('today').textContent =
    `${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일`;
  const d = Math.floor((t - START) / 86400000);
  document.getElementById('count').textContent = d.toLocaleString('ko-KR');
}
refresh();
setInterval(refresh, 60000);

// iPhone 7/8의 Safari에서 주소창/도구막대가 접힐 수 있도록 시도합니다.
// 홈 화면에 추가하여 실행한 경우에는 standalone 모드로 열려 주소창이 표시되지 않습니다.
function tryHideSafariBars(){
  const standalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (!standalone) {
    setTimeout(() => window.scrollTo(0, 1), 250);
    setTimeout(() => window.scrollTo(0, 1), 900);
  }
}
window.addEventListener('load', tryHideSafariBars);
window.addEventListener('orientationchange', tryHideSafariBars);

</script>
