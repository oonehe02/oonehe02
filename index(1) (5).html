<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>영신공업주식회사 무재해 현황판</title>
<style>
:root{
  --blue:#143f86;
  --blue2:#0b2b60;
  --navy:#07162e;
  --white:#f6f7fb;
  --green:#61e33b;
  --yellow:#ffd928;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#020912;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.board{
  width:100vw;height:100vh;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:linear-gradient(135deg,#17468e,#09214c);
  border:5px solid #061323;
  border-radius:clamp(22px,3vw,52px);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.05);
  display:grid;
  grid-template-rows:28% 35% 19% 10%;
  gap:1.4vh;
}
.header{
  background:linear-gradient(105deg,#f9fafc,#e8e9ee);
  border-radius:clamp(18px,2vw,40px);
  display:grid;grid-template-columns:1.2fr .8fr;
  align-items:center;padding:2.5vh 4vw;
}
.brand{display:flex;align-items:center;gap:2.2vw;min-width:0}
.logo-img{width:13vh;height:13vh;min-width:82px;object-fit:contain;display:block;mix-blend-mode:multiply}
.company{font-size:clamp(22px,4.2vw,72px);font-weight:800;color:#111;line-height:1.05;white-space:nowrap}
.eng{font-size:clamp(13px,2.25vw,34px);font-weight:600;margin-top:1.3vh;letter-spacing:.03em}
.today{border-left:2px solid #aeb4c1;text-align:center;color:#13295b;height:85%;display:flex;flex-direction:column;justify-content:center}
.today .label{font-size:clamp(14px,2.1vw,32px);font-weight:800}
.today .date{font-size:clamp(23px,3.8vw,61px);font-weight:900;margin-top:.8vh;white-space:nowrap}
.today .weekday{font-size:clamp(16px,2.4vw,37px);font-weight:800;margin-top:.2vh}
.main{display:grid;grid-template-columns:41% 59%;gap:1.4vw}
.card{background:linear-gradient(145deg,#0a1c37,#061226);border-radius:clamp(18px,2.5vw,40px);color:var(--white);display:flex;align-items:center;justify-content:center;min-width:0}
.start{gap:2.3vw;padding:2vw}
.calendar{width:9vh;height:9vh;min-width:58px;border-radius:50%;background:linear-gradient(145deg,#2e6cc5,#123568);display:flex;align-items:center;justify-content:center;font-size:clamp(35px,6vw,90px)}
.starttext{text-align:center}
.smalltitle{font-size:clamp(18px,2.7vw,43px);font-weight:800;margin-bottom:2vh}
.startdate{font-size:clamp(24px,3.5vw,55px);font-weight:800;white-space:nowrap}
.count{flex-direction:column;padding:1.4vh 2vw}
.counttitle{font-size:clamp(20px,2.8vw,43px);font-weight:800;margin-bottom:.5vh}
.countnum{font-size:clamp(75px,13vw,220px);line-height:.8;font-weight:900;letter-spacing:-.055em;color:var(--green);text-shadow:0 4px 12px rgba(84,255,48,.2);white-space:nowrap}
.unit{font-size:.23em;color:var(--white);margin-left:.05em;vertical-align:middle}
.slogan{background:linear-gradient(105deg,#17731b,#176b1d);border-radius:clamp(18px,2.2vw,35px);display:flex;align-items:center;justify-content:center;gap:2vw;color:#fff;padding:1vw}
.shield{font-size:clamp(35px,6vw,82px)}
.slogantext{font-size:clamp(23px,4vw,64px);font-weight:900;white-space:nowrap}
.footer{color:#e8ebf4;display:flex;align-items:center;justify-content:center;gap:3vw;font-size:clamp(12px,1.7vw,26px);font-weight:600;white-space:nowrap}
.footer strong{font-size:1.25em}


/* 회사명·로고 제거 후 숫자와 문구를 더 강하게 강조 */
.header{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:1.8vh 3vw;
}
.brand,.logo-img,.company,.eng,.header-spacer{display:none!important}
.today.full-today{
  border-left:none;
  width:100%;
  height:100%;
  text-align:center;
  align-items:center;
}
.today .label{
  font-size:clamp(22px,3.2vw,48px);
  letter-spacing:.08em;
  margin-bottom:.4vh;
}
.today .date{
  font-size:clamp(48px,6.6vw,105px);
  line-height:1;
  letter-spacing:-.04em;
  margin-top:.5vh;
}
.today .weekday{
  font-size:clamp(26px,3.6vw,56px);
  margin-top:.8vh;
}
.start{
  padding:2vw;
}
.starttext{
  width:100%;
}
.smalltitle{
  font-size:clamp(28px,4vw,62px);
  margin-bottom:2.4vh;
  letter-spacing:-.04em;
}
.startdate{
  font-size:clamp(38px,5vw,82px);
  letter-spacing:-.045em;
}
.counttitle{
  font-size:clamp(28px,4vw,62px);
  margin-bottom:1vh;
}
.countnum{
  font-size:clamp(92px,15vw,250px);
  letter-spacing:-.065em;
}
.unit{
  font-size:.25em;
  margin-left:.08em;
}
.slogantext{
  font-size:clamp(30px,4.7vw,74px);
  letter-spacing:-.04em;
}
.footer{
  font-size:clamp(14px,1.95vw,30px);
}


/* 회사명과 원래 로고 복원 */
.header{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  justify-content:initial;
  align-items:center;
  padding:2vh 3.5vw;
}
.brand.restored-brand{
  display:flex!important;
  align-items:center;
  gap:2vw;
  min-width:0;
}
.logo-img.restored-logo{
  display:block!important;
  width:12vh;
  height:12vh;
  min-width:78px;
  object-fit:contain;
  mix-blend-mode:multiply;
}
.company-wrap{
  display:block!important;
  min-width:0;
}
.company{
  display:block!important;
  font-size:clamp(24px,4.1vw,70px);
  font-weight:900;
  color:#111;
  line-height:1.05;
  white-space:nowrap;
}
.eng{
  display:block!important;
  font-size:clamp(13px,2.15vw,34px);
  font-weight:650;
  margin-top:1.2vh;
  color:#151922;
  white-space:nowrap;
}
.today{
  border-left:2px solid #aeb4c1;
  width:auto!important;
  height:85%!important;
  text-align:center;
}
.today.full-today{border-left:2px solid #aeb4c1}


/* 기준일을 무재해 시작일과 같은 크기로 강조하고 날짜를 2줄로 배치 */
.today .label{
  font-size:clamp(28px,4vw,62px)!important;
  font-weight:900;
  margin-bottom:1.2vh!important;
}
.today .date{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.3vh;
  margin-top:0!important;
  line-height:1!important;
}
.today .year-line,
.today .monthday-line{
  display:block;
  font-size:clamp(38px,5vw,82px)!important;
  font-weight:900;
  letter-spacing:-.045em;
  white-space:nowrap;
}
.today .weekday{
  font-size:clamp(22px,3vw,46px)!important;
  margin-top:1vh!important;
}


/* 날짜 옆에 짧은 요일 표기: 예) 8월 27일 (목) */
.today .date-row{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:.6vw;
  white-space:nowrap;
}
.today .weekday{
  display:inline-block!important;
  font-size:clamp(26px,3.4vw,54px)!important;
  font-weight:900;
  margin:0!important;
  letter-spacing:-.04em;
  white-space:nowrap;
}


/* 문구는 조금 작게 */
.slogantext{
  font-size:clamp(24px,3.6vw,58px)!important;
}

/* 기준일 영역이 잘리지 않도록 높이와 날짜 크기 조정 */
.header{
  grid-template-columns:1.1fr .9fr!important;
  padding:1.4vh 3vw!important;
}
.today{
  height:96%!important;
  min-width:0;
  overflow:visible!important;
}
.today .label{
  font-size:clamp(24px,3.3vw,52px)!important;
  margin-bottom:.5vh!important;
}
.today .date{
  gap:.15vh!important;
  overflow:visible!important;
}
.today .year-line{
  font-size:clamp(32px,4.2vw,68px)!important;
  line-height:1.05!important;
}
.today .date-row{
  gap:.35vw!important;
  width:100%;
}
.today .monthday-line{
  font-size:clamp(30px,3.8vw,62px)!important;
  line-height:1.08!important;
}
.today .weekday{
  font-size:clamp(21px,2.7vw,42px)!important;
  line-height:1!important;
  flex:0 0 auto;
}


/* 요일 표시 제거 + 초록색 안전 문구 영역 높이 축소 */
.board{
  grid-template-rows:30% 39% 13% 10%!important;
}
.slogan{
  padding:.35vh 1vw!important;
  border-radius:clamp(14px,1.7vw,28px)!important;
  gap:1.2vw!important;
}
.shield{
  font-size:clamp(28px,4.2vw,58px)!important;
}
.slogantext{
  font-size:clamp(22px,3.25vw,52px)!important;
}

@media (max-aspect-ratio: 1/1){
  body{min-width:100vh;min-height:100vw;overflow:hidden}
  .board{width:100vh;height:100vw;transform:rotate(90deg);transform-origin:center}
}
</style>
</head>

    const weekEl = document.getElementById('todayWeek');
    if (weekEl) weekEl.textContent = `(${weekdays[today.getDay()]})`;
    document.getElementById('days').textContent =
      diffDays.toLocaleString('ko-KR');
  }

  updateBoard();
  setInterval(updateBoard, 60 * 1000);

  // 자정이 지나면 자동 갱신
  function scheduleMidnightUpdate(){
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 1);
    setTimeout(function(){
      updateBoard();
      scheduleMidnightUpdate();
    }, next - now);
  }
  scheduleMidnightUpdate();
})();
</script>
</body>
</html>
